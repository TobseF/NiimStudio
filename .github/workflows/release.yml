# Builds the signed release APK when a version tag is pushed (e.g. "0.6" or "0.6.1", equal to
# versionName) and attaches it to the GitHub release.
#
# The same APK serves GitHub, Obtainium, Komi Store and F-Droid: F-Droid builds the tagged commit
# itself, checks that its build is byte-identical to this APK (reproducible build) and then
# publishes this APK with its original signature.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   NIIMSTUDIO_KEYSTORE_BASE64   release keystore (.jks), base64-encoded
#   NIIMSTUDIO_STORE_PASSWORD    keystore password
#   NIIMSTUDIO_KEY_ALIAS         key alias (niimstudio)
#   NIIMSTUDIO_KEY_PASSWORD      key password
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  # SHA-256 of the release signing certificate – the build fails if the APK is signed with another key.
  SIGNING_CERT_SHA256: e25da1eb1ed9f653b024b98a8648172bac6855fa01875989a83a3db4ccd949ce

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag, version and changelog
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name"; exit 1
          fi
          for locale in en-US de-DE; do
            test -f "fastlane/metadata/android/$locale/changelogs/$code.txt" \
              || { echo "::error::Missing fastlane/metadata/android/$locale/changelogs/$code.txt"; exit 1; }
          done
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "APK=app/build/outputs/apk/release/NiimStudio-$name-release.apk" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          NIIMSTUDIO_KEYSTORE_BASE64: ${{ secrets.NIIMSTUDIO_KEYSTORE_BASE64 }}
          NIIMSTUDIO_STORE_PASSWORD: ${{ secrets.NIIMSTUDIO_STORE_PASSWORD }}
          NIIMSTUDIO_KEY_ALIAS: ${{ secrets.NIIMSTUDIO_KEY_ALIAS }}
          NIIMSTUDIO_KEY_PASSWORD: ${{ secrets.NIIMSTUDIO_KEY_PASSWORD }}
        run: |
          if [ -z "$NIIMSTUDIO_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NIIMSTUDIO_KEYSTORE_BASE64 is not set"; exit 1
          fi
          export NIIMSTUDIO_STORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$NIIMSTUDIO_KEYSTORE_BASE64" | base64 --decode > "$NIIMSTUDIO_STORE_FILE"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$NIIMSTUDIO_STORE_FILE"

      - name: Verify signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q "certificate SHA-256 digest: $SIGNING_CERT_SHA256" certs.txt \
            || { echo "::error::APK is not signed with the release key"; exit 1; }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "fastlane/metadata/android/en-US/changelogs/$VERSION_CODE.txt"
            echo
            echo "**APK SHA-256:** \`$(sha256sum "$APK" | cut -d ' ' -f 1)\`"
            echo
            echo "**Signing certificate SHA-256:** \`$SIGNING_CERT_SHA256\`"
          } > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "NiimStudio $GITHUB_REF_NAME" --notes-file notes.md
          fi
